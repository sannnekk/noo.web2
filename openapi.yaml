                $ref: "#/components/schemas/SerializedNooException"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerializedNooException"
  /assigned-work/{assignedWorkId}/add-helper-mentor:
    patch:
      tags:
        - AssignedWork
      summary:
        Adds a helper mentor to the assigned work so that they both can check
        the assigned work.
      parameters:
        - name: assignedWorkId
          in: path
          description: Universally Unique Lexicographically Sortable Identifier (ULID).
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddHelperMentorOptionsDTO"
          text/json:
            schema:
              $ref: "#/components/schemas/AddHelperMentorOptionsDTO"
          application/*+json:
            schema:
              $ref: "#/components/schemas/AddHelperMentorOptionsDTO"
      responses:
        "204":
          description: No Content
