        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerializedNooException"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerializedNooException"
  /assigned-work/{assignedWorkId}/archive:
    patch:
      tags:
        - AssignedWork
      summary: Archives an assigned work.
      description: |-
        There is an archived flag in the assigned work for the following roles: student, mentor, and assistant.
        Toggling the archived flag for mentors will not affect the archived flag for students and assistants and so on.
      parameters:
        - name: assignedWorkId
          in: path
          description: Universally Unique Lexicographically Sortable Identifier (ULID).
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
      responses:
        "204":
          description: No Content
          content:
            application/json: {}
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerializedNooException"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerializedNooException"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerializedNooException"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerializedNooException"
  /assigned-work/{assignedWorkId}/unarchive:
    patch:
      tags:
        - AssignedWork
      summary: unarchives an assigned work.
      description: |-
        There is an archived flag in the assigned work for the following roles: student, mentor, and assistant.
        Toggling the archived flag for mentors will not affect the archived flag for students and assistants and so on.
      parameters:
        - name: assignedWorkId
          in: path
          description: Universally Unique Lexicographically Sortable Identifier (ULID).
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
