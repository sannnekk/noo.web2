                $ref: "#/components/schemas/SerializedNooException"
  /assigned-work/{assignedWorkId}/return-to-solve:
    patch:
      tags:
        - AssignedWork
      summary: |-
        Changes the solve status of the assigned work back to in progress.
        This is usually used when the assigned work was marked as solved by mistake.
      parameters:
        - name: assignedWorkId
          in: path
          description: Universally Unique Lexicographically Sortable Identifier (ULID).
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
      responses:
        "204":
          description: No Content
          content:
            application/json: {}
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerializedNooException"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerializedNooException"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerializedNooException"
        "404":
