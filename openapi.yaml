components:
  schemas:
    AddHelperMentorOptionsDTO:
      required:
        - mentorId
      type: object
      properties:
        mentorId:
          $ref: "#/components/schemas/Ulid"
      additionalProperties: false
    AssignedWorkAnswerDTO:
      required:
        - _entityName
        - createdAt
        - id
        - maxScore
        - status
        - taskId
      type: object
      properties:
        _entityName:
          minLength: 1
          type: string
          readOnly: true
        id:
          $ref: "#/components/schemas/Ulid"
        richTextContent:
          $ref: "#/components/schemas/IRichTextType"
        wordContent:
          type: string
          nullable: true
        mentorComment:
          $ref: "#/components/schemas/IRichTextType"
        score:
          type: integer
          format: int32
          nullable: true
        maxScore:
          type: integer
          format: int32
        status:
          $ref: "#/components/schemas/AssignedWorkAnswerStatus"
        detailedScore:
          type: object
          additionalProperties:
            type: integer
            format: int32
          nullable: true
        taskId:
          $ref: "#/components/schemas/Ulid"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    AssignedWorkAnswerStatus:
      enum:
        - not-submitted
        - submitted
        - checked
      type: string
    AssignedWorkCheckStatus:
      enum:
        - not-checked
        - in-progress
        - checked
      type: string
    AssignedWorkDTO:
      required:
        - _entityName
        - attempt
        - checkStatus
        - id
        - isArchivedByAssistants
        - isArchivedByMentors
        - isArchivedByStudent
        - maxScore
        - solveStatus
        - studentId
        - title
        - type
      type: object
      properties:
        _entityName:
          minLength: 1
          type: string
          readOnly: true
        id:
          $ref: "#/components/schemas/Ulid"
        title:
          minLength: 1
          type: string
        type:
          $ref: "#/components/schemas/WorkType"
        attempt:
          type: integer
          format: int32
        solveStatus:
          $ref: "#/components/schemas/AssignedWorkSolveStatus"
        soldeDeadlineAt:
          type: string
          format: date-time
          nullable: true
        solvedAt:
          type: string
          format: date-time
          nullable: true
        checkStatus:
          $ref: "#/components/schemas/AssignedWorkCheckStatus"
        checkDeadlineAt:
          type: string
          format: date-time
          nullable: true
        checkedAt:
          type: string
          format: date-time
          nullable: true
        score:
          type: integer
          format: int32
          nullable: true
        maxScore:
          type: integer
          format: int32
        isArchivedByStudent:
          type: boolean
        isArchivedByMentors:
          type: boolean
        isArchivedByAssistants:
          type: boolean
        studentCommentId:
          $ref: "#/components/schemas/Ulid"
        mainMentorCommentId:
          $ref: "#/components/schemas/Ulid"
        helperMentorCommentId:
          $ref: "#/components/schemas/Ulid"
        studentId:
          $ref: "#/components/schemas/Ulid"
        mainMentorId:
          $ref: "#/components/schemas/Ulid"
        helperMentorId:
          $ref: "#/components/schemas/Ulid"
        student:
          $ref: "#/components/schemas/UserDTO"
        mainMentor:
          $ref: "#/components/schemas/UserDTO"
        helperMentor:
          $ref: "#/components/schemas/UserDTO"
        work:
          $ref: "#/components/schemas/WorkDTO"
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AssignedWorkAnswerDTO"
          nullable: true
      additionalProperties: false
    AssignedWorkDTOApiResponseDTO:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AssignedWorkDTO"
        meta:
          nullable: true
      additionalProperties: false
    AssignedWorkDTOIEnumerableApiResponseDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AssignedWorkDTO"
          nullable: true
        meta:
          nullable: true
      additionalProperties: false
    AssignedWorkHistoryDTO:
